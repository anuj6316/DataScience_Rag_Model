<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>BeeBot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            mint: {
              50: '#F2FBF5', // Light background
              100: '#E6F7EB',
              200: '#C2EBD0',
              300: '#9EDFB5',
              400: '#4ADE80', // Accent Green
              500: '#22C55E',
              600: '#16A34A',
              900: '#14532D',
              950: '#0F0F0F', // Dark background
            }
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'orb-breathe': 'orbBreathe 4s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            orbBreathe: {
              '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
              '50%': { transform: 'scale(1.05)', opacity: '1' },
            }
          }
        },
      },
    }
  </script>
  <style>
    /* ThinkAI Global Styles */

    /* Light Mode: Pale Mint/White */
    .bg-think-light {
      background-color: #F2FBF5;
      background-image:
        radial-gradient(circle at 50% 30%, rgba(74, 222, 128, 0.08) 0%, transparent 60%);
    }

    /* Dark Mode: Deep Black */
    .bg-think-dark {
      background-color: #0F0F0F;
      background-image:
        radial-gradient(circle at 50% 30%, rgba(74, 222, 128, 0.05) 0%, transparent 60%);
    }

    /* Glass Cards */
    .glass-panel-light {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(74, 222, 128, 0.1);
      box-shadow: 0 4px 20px rgba(74, 222, 128, 0.05);
    }

    .glass-panel-dark {
      background: rgba(20, 20, 20, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    /* Prompt Cards */
    .prompt-card {
      transition: all 0.2s ease;
    }

    .prompt-card:hover {
      transform: translateY(-2px);
    }

    /* Green Orb Glow */
    .orb-glow {
      background: radial-gradient(circle, rgba(74, 222, 128, 1) 0%, rgba(34, 197, 94, 0.8) 40%, transparent 80%);
      filter: blur(20px);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.2);
      border-radius: 3px;
    }

    /* Custom Scrollbar for sleek look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.4);
    }

    /* Hide scrollbar when not hovering for a cleaner look (optional, but good for minimalism) */
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: transparent;
    }

    .custom-scrollbar:hover::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.2);
    }

    /* Custom styling for markdown links */
    .prose a {
      color: #60a5fa !important;
      /* Blue-400 */
      text-decoration: none;
      transition: all 0.2s ease;
      border-bottom: 1px solid transparent;
    }

    .prose a:hover {
      color: #93c5fd !important;
      /* Blue-300 */
      border-bottom-color: #60a5fa;
    }

    /* Better spacing for markdown content */
    .prose p {
      margin-top: 0.75em;
      margin-bottom: 0.75em;
      line-height: 1.7;
    }

    /* Headings */
    .prose h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-top: 1.5em;
      margin-bottom: 0.75em;
      color: #f59e0b;
      border-bottom: 2px solid #374151;
      padding-bottom: 0.5em;
    }

    .prose h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 1.5em;
      margin-bottom: 0.75em;
      color: #fbbf24;
    }

    .prose h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.25em;
      margin-bottom: 0.5em;
      color: #d1d5db;
    }

    .prose h4 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-top: 1em;
      margin-bottom: 0.5em;
      color: #d1d5db;
    }

    /* Lists */
    .prose ul,
    .prose ol {
      margin-top: 0.75em;
      margin-bottom: 0.75em;
      padding-left: 1.5em;
    }

    .prose li {
      margin-top: 0.5em;
      margin-bottom: 0.5em;
      line-height: 1.6;
    }

    .prose li>p {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
    }

    /* Blockquotes */
    .prose blockquote {
      border-left: 4px solid #3b82f6;
      padding-left: 1em;
      padding-top: 0.5em;
      padding-bottom: 0.5em;
      margin: 1em 0;
      font-style: italic;
      background-color: rgba(31, 41, 55, 0.3);
      border-radius: 0 0.375rem 0.375rem 0;
      color: #d1d5db;
    }

    /* Horizontal rules */
    .prose hr {
      margin: 2em 0;
      border-color: #374151;
      border-width: 1px;
    }

    /* Tables */
    .prose table {
      width: 100%;
      margin: 1.5em 0;
      border-collapse: collapse;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      overflow: hidden;
      background-color: rgba(17, 24, 39, 0.5);
    }

    .prose thead {
      background-color: rgba(31, 41, 55, 0.8);
      border-bottom: 2px solid #4b5563;
    }

    .prose th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      color: #f3f4f6;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prose td {
      padding: 0.75rem 1rem;
      border-top: 1px solid #374151;
      color: #e5e7eb;
    }

    .prose tbody tr {
      transition: background-color 0.15s ease;
    }

    .prose tbody tr:hover {
      background-color: rgba(31, 41, 55, 0.4);
    }

    .prose tbody tr:nth-child(even) {
      background-color: rgba(17, 24, 39, 0.3);
    }

    /* Code blocks */
    .prose pre {
      background-color: #0a0a0a !important;
      border: 1px solid #374151;
      border-radius: 0.5rem;
      padding: 1rem;
      margin: 1em 0;
      overflow-x: auto;
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .prose pre code {
      background-color: transparent !important;
      padding: 0 !important;
      border-radius: 0;
      color: #e5e7eb;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Inline code */
    .prose code {
      background-color: #1f2937;
      color: #fcd34d;
      padding: 0.2em 0.4em;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 500;
    }

    .prose pre code {
      background-color: transparent;
      padding: 0;
    }

    /* Strong and emphasis */
    .prose strong {
      color: #f3f4f6;
      font-weight: 600;
    }

    .prose em {
      color: #d1d5db;
      font-style: italic;
    }

    /* Images */
    .prose img {
      border-radius: 0.5rem;
      margin: 1.5em 0;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      max-width: 100%;
      height: auto;
    }

    /* Task lists (GitHub-style checkboxes) */
    .prose input[type="checkbox"] {
      margin-right: 0.5em;
      cursor: pointer;
    }

    /* Better spacing between sections */
    .prose>*+* {
      margin-top: 1em;
    }

    .prose>h1+*,
    .prose>h2+*,
    .prose>h3+* {
      margin-top: 0.5em;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-950 text-gray-100 antialiased overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
